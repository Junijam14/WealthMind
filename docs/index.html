<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name='impact-site-verification' value='b95785f3-340c-46c6-bfc6-170f4a7421b4' />
<link rel="icon" type="image/png" href="wealthmind_africa_logo-1.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WealthMind — Turn Knowledge Into Real Income</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080B10;--bg2:#0E1117;--bg3:#141924;--bg4:#1C2333;--border:rgba(255,255,255,0.07);--border2:rgba(99,179,237,0.22);--gold:#F5A623;--gold2:#FFD166;--blue:#63B3ED;--blue2:#4299E1;--green:#48BB78;--red:#FC8181;--text:#E8EDF5;--muted:#8892A4;--muted2:#5C6878;--font-h:'Syne',sans-serif;--font-b:'Outfit',sans-serif;--r:14px;--shadow:0 4px 24px rgba(0,0,0,0.4);--shadow2:0 8px 48px rgba(0,0,0,0.6)}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:var(--font-b);overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:rgba(99,179,237,0.3);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.04)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
@keyframes shimmerFill{0%{background-position:-200% 0}100%{background-position:200% 0}}
.anim-up{animation:fadeUp .55s ease both}.anim-in{animation:fadeIn .4s ease both}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;justify-content:space-between;padding:0 52px;height:68px;background:rgba(8,11,16,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:all .3s}
.nav.sc{background:rgba(8,11,16,.97);box-shadow:var(--shadow)}
.nav-logo{font-family:var(--font-h);font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.nav-logo em{-webkit-text-fill-color:var(--text);font-style:normal;font-weight:300}
.nav-links{display:flex;align-items:center;gap:6px}
.nl{color:var(--muted);font-size:.87rem;font-weight:500;background:none;border:none;cursor:pointer;padding:8px 13px;border-radius:8px;transition:all .2s;font-family:var(--font-b)}
.nl:hover{color:var(--text);background:rgba(255,255,255,.06)}
.nl.act{color:var(--blue)}
.nb{padding:9px 20px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;font-family:var(--font-b);transition:all .2s}
.nb-g{background:transparent;color:var(--blue);border:1px solid rgba(99,179,237,.35)}
.nb-g:hover{background:rgba(99,179,237,.1)}
.nb-p{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0D1117;font-weight:700}
.nb-p:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(245,166,35,.35)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:8px}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:all .3s}
.mob-menu{display:none;position:fixed;top:68px;left:0;right:0;z-index:800;background:var(--bg2);border-bottom:1px solid var(--border);padding:16px;flex-direction:column;gap:4px}
.mob-menu.open{display:flex;animation:fadeIn .2s ease}
.ml{color:var(--muted);font-size:.9rem;font-weight:500;background:none;border:none;cursor:pointer;padding:11px 16px;border-radius:8px;text-align:left;font-family:var(--font-b);transition:all .2s;width:100%}
.ml:hover{color:var(--text);background:var(--bg3)}

/* HERO */
.hero{min-height:100vh;padding:148px 52px 100px;display:flex;align-items:center;position:relative;overflow:hidden}
.hg1{position:absolute;top:-120px;right:-80px;width:600px;height:600px;background:radial-gradient(circle,rgba(245,166,35,.1) 0%,transparent 70%);animation:pulseGlow 5s ease-in-out infinite;pointer-events:none}
.hg2{position:absolute;bottom:-80px;left:-80px;width:500px;height:500px;background:radial-gradient(circle,rgba(99,179,237,.09) 0%,transparent 70%);animation:pulseGlow 6s ease-in-out infinite 2s;pointer-events:none}
.hgrid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(99,179,237,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,179,237,.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%)}
.hero-c{max-width:760px;position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);padding:6px 16px;border-radius:100px;font-size:.74rem;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:28px;animation:fadeUp .5s ease both}
.bdot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:pulseGlow 2s infinite}
h1{font-family:var(--font-h);font-size:clamp(2.6rem,5.5vw,4.6rem);font-weight:800;line-height:1.06;margin-bottom:24px;animation:fadeUp .5s .1s ease both}
.tg{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb{background:linear-gradient(135deg,var(--blue),#9F7AEA);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:1.12rem;color:var(--muted);line-height:1.75;margin-bottom:40px;max-width:580px;animation:fadeUp .5s .2s ease both}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;animation:fadeUp .5s .3s ease both}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:10px;font-size:.93rem;font-weight:600;cursor:pointer;border:none;font-family:var(--font-b);transition:all .25s;text-decoration:none}
.btn-gld{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0D1117}
.btn-gld:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(245,166,35,.4)}
.btn-out{background:transparent;color:var(--blue);border:1px solid rgba(99,179,237,.35)}
.btn-out:hover{background:rgba(99,179,237,.1);transform:translateY(-2px)}
.btn-blu{background:linear-gradient(135deg,var(--blue2),#3182CE);color:#fff}
.btn-blu:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(66,153,225,.35)}
.btn-sm{padding:9px 20px;font-size:.82rem;border-radius:8px}
.btn-xs{padding:7px 13px;font-size:.76rem;border-radius:7px}
.hero-stats{display:flex;gap:44px;margin-top:60px;padding-top:38px;border-top:1px solid var(--border);animation:fadeUp .5s .4s ease both;flex-wrap:wrap}
.sn{font-family:var(--font-h);font-size:1.9rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sl{font-size:.75rem;color:var(--muted);margin-top:4px}

/* SECTIONS */
.sec{padding:96px 52px}
.sec-alt{background:var(--bg2)}
.sec-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:2.5px;color:var(--blue);font-weight:700;margin-bottom:12px}
.sec-title{font-family:var(--font-h);font-size:clamp(1.8rem,3.5vw,2.7rem);font-weight:800;line-height:1.1;margin-bottom:14px}
.sec-sub{color:var(--muted);font-size:.97rem;line-height:1.72;max-width:520px;margin-bottom:52px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

/* CARDS */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:28px;transition:all .3s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,179,237,.2),transparent);transform:scaleX(0);transition:transform .4s}
.card:hover{border-color:rgba(99,179,237,.2);transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,.5)}
.card:hover::before{transform:scaleX(1)}
.step-n{font-family:var(--font-h);font-size:3.2rem;font-weight:800;color:rgba(99,179,237,.08);line-height:1;margin-bottom:12px}
.ci{font-size:1.9rem;margin-bottom:14px}
.card h3{font-family:var(--font-h);font-size:1.02rem;font-weight:700;margin-bottom:10px}
.card p{font-size:.86rem;color:var(--muted);line-height:1.65}
.earn-b{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:100px;margin-bottom:12px}
.sl-1{border-left:3px solid var(--gold)}
.sl-2{border-left:3px solid var(--blue)}
.sl-3{border-left:3px solid #9F7AEA}
.sl-4{border-left:3px solid var(--green)}

/* TOOL CARDS */
.tc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:24px;transition:all .3s;position:relative;overflow:hidden}
.tc:hover{border-color:var(--border2);transform:translateY(-4px);box-shadow:var(--shadow2)}
.tc-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:10px}
.t-tag{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border-radius:100px;white-space:nowrap}
.t-em{font-size:2rem;margin-bottom:10px}
.t-nm{font-family:var(--font-h);font-size:.97rem;font-weight:700;margin-bottom:6px}
.t-ds{font-size:.81rem;color:var(--muted);line-height:1.6;margin-bottom:14px}
.t-cm{font-size:.77rem;color:var(--green);font-weight:700;margin-bottom:12px}
.t-btn{display:block;width:100%;padding:10px;text-align:center;background:rgba(99,179,237,.1);color:var(--blue);border:1px solid rgba(99,179,237,.25);border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:var(--font-b);transition:all .2s;text-decoration:none}
.t-btn:hover{background:rgba(99,179,237,.22);border-color:var(--blue2)}

/* EMAIL */
.email-sec{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:100px 52px;text-align:center;position:relative;overflow:hidden}
.eg{position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:500px;height:300px;background:radial-gradient(circle,rgba(245,166,35,.1),transparent 70%);pointer-events:none}
.ef{display:flex;flex-direction:column;gap:12px;max-width:430px;margin:0 auto 20px;position:relative;z-index:2}
.inp{background:var(--bg4);border:1px solid var(--border);color:var(--text);padding:13px 18px;border-radius:10px;font-family:var(--font-b);font-size:.9rem;outline:none;transition:border-color .2s;width:100%}
.inp:focus{border-color:var(--blue2)}
.inp::placeholder{color:var(--muted2)}
.inp-err{border-color:var(--red)!important}
.ferr{font-size:.77rem;color:var(--red);text-align:left;margin-top:-6px}

/* AUTH */
.auth-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 24px 60px;position:relative}
.auth-glow{position:absolute;width:400px;height:400px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(99,179,237,.07),transparent 70%);pointer-events:none}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:440px;position:relative;z-index:2;box-shadow:var(--shadow2)}
.auth-lgo{text-align:center;margin-bottom:28px;font-family:var(--font-h);font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-ttl{font-family:var(--font-h);font-size:1.55rem;font-weight:800;text-align:center;margin-bottom:8px}
.auth-sub{color:var(--muted);font-size:.87rem;text-align:center;margin-bottom:28px}
.fg{margin-bottom:16px}
.fl{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.auth-sw{text-align:center;margin-top:22px;color:var(--muted);font-size:.84rem}
.auth-sw button{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:600;font-family:var(--font-b);font-size:.84rem}
.divider{display:flex;align-items:center;gap:14px;margin:18px 0;color:var(--muted2);font-size:.76rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* DASHBOARD */
.dash-pg{min-height:100vh;padding:110px 52px 80px}
.dash-greet{font-family:var(--font-h);font-size:1.9rem;font-weight:800;margin-bottom:6px}
.dash-sub2{color:var(--muted);font-size:.88rem;margin-bottom:40px}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
.ds{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.ds-v{font-family:var(--font-h);font-size:1.75rem;font-weight:800;margin-bottom:4px}
.ds-l{font-size:.76rem;color:var(--muted)}
.prog-bar{height:5px;background:var(--bg4);border-radius:3px;margin-top:10px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue2),var(--blue));transition:width 1s ease}

/* BLOG */
.blog-pg{min-height:100vh;padding:110px 52px 80px}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.bc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:all .3s;cursor:pointer}
.bc:hover{transform:translateY(-5px);border-color:var(--border2);box-shadow:var(--shadow2)}
.bt{height:176px;display:flex;align-items:center;justify-content:center;font-size:3.2rem}
.bb{padding:22px}
.bcat{font-size:.69rem;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--blue);margin-bottom:10px}
.btitle{font-family:var(--font-h);font-size:1.02rem;font-weight:700;line-height:1.4;margin-bottom:10px}
.bex{font-size:.81rem;color:var(--muted);line-height:1.65;margin-bottom:14px}
.bmeta{display:flex;justify-content:space-between;align-items:center}
.bdate{font-size:.73rem;color:var(--muted2)}
.bread{font-size:.73rem;color:var(--blue);font-weight:600}
.post-wrap{max-width:760px;margin:0 auto}
.post-title{font-family:var(--font-h);font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;line-height:1.2;margin-bottom:16px}
.post-body{font-size:.95rem;line-height:1.85;color:#CBD5E0}
.post-body h2{font-family:var(--font-h);font-size:1.3rem;font-weight:700;margin:30px 0 12px;color:var(--text)}
.post-body h3{font-family:var(--font-h);font-size:1.08rem;font-weight:700;margin:22px 0 8px;color:var(--text)}
.post-body p{margin-bottom:16px}
.post-body ul{padding-left:20px;margin-bottom:16px}
.post-body li{margin-bottom:7px}
.post-body a{color:var(--blue);text-decoration:underline}
.post-body .abox{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:18px 22px;margin:24px 0}
.post-body .abox strong{display:block;margin-bottom:6px;color:var(--gold)}

/* THANKYOU */
.ty-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 24px;text-align:center;position:relative}
.ty-box{max-width:500px;position:relative;z-index:2}
.ty-icon{font-size:4.5rem;margin-bottom:22px;animation:float 3s ease-in-out infinite;display:block}
.ty-title{font-family:var(--font-h);font-size:2.3rem;font-weight:800;margin-bottom:12px}
.ty-sub{color:var(--muted);font-size:1rem;line-height:1.7;margin-bottom:28px}
.rbar{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:13px 18px;font-size:.83rem;color:var(--muted)}
.rprog{height:4px;background:var(--bg4);border-radius:2px;margin-top:10px;overflow:hidden}
.rfill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));background-size:200% 100%;transition:width 60ms linear}

/* MONO */
.mono-c{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:30px;text-align:center}
.mono-i{font-size:2.4rem;margin-bottom:14px}
.mono-c h3{font-family:var(--font-h);font-size:1.08rem;font-weight:700;margin-bottom:10px}
.mono-c p{font-size:.84rem;color:var(--muted);line-height:1.65}
.mono-amt{font-family:var(--font-h);font-size:1.5rem;font-weight:800;color:var(--gold);margin:12px 0 4px}

/* TOAST */
.toast-ctr{position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 18px;min-width:250px;max-width:320px;box-shadow:var(--shadow2);display:flex;align-items:flex-start;gap:11px;animation:slideIn .35s cubic-bezier(.34,1.56,.64,1) both}
.toast.rm{animation:slideOut .3s ease forwards}
.toast-ico{font-size:1.15rem;margin-top:1px}
.toast strong{display:block;font-size:.86rem;font-weight:700;margin-bottom:2px}
.toast span{font-size:.76rem;color:var(--muted)}
.toast-x{margin-left:auto;background:none;border:none;color:var(--muted2);cursor:pointer;font-size:1.1rem;padding:0 0 0 6px;line-height:1}

/* FOOTER */
.footer{background:var(--bg2);border-top:1px solid var(--border);padding:60px 52px 30px}
.fg-grid{display:grid;grid-template-columns:2.5fr 1fr 1fr 1fr;gap:44px;margin-bottom:44px}
.f-logo{font-family:var(--font-h);font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.f-desc{font-size:.84rem;color:var(--muted);line-height:1.7;max-width:240px}
.f-col h4{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);margin-bottom:16px}
.f-col ul{list-style:none}
.f-col ul li{margin-bottom:10px}
.f-col ul a,.f-col ul button{color:var(--muted);font-size:.84rem;text-decoration:none;background:none;border:none;cursor:pointer;font-family:var(--font-b);transition:color .2s;padding:0;text-align:left}
.f-col ul a:hover,.f-col ul button:hover{color:var(--gold)}
.f-bot{display:flex;justify-content:space-between;align-items:center;padding-top:22px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px}
.f-bot p{font-size:.76rem;color:var(--muted2)}
.c-item{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:8px}

/* LOADING */
.load-scr{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px}
.spinner{width:22px;height:22px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spinner-lg{width:36px;height:36px;border-width:3px;border-top-color:var(--gold)}
.load-logo{font-family:var(--font-h);font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.84rem;cursor:pointer;background:none;border:none;font-family:var(--font-b);margin-bottom:26px;transition:color .2s;padding:0}
.back-btn:hover{color:var(--blue)}
.err-box{background:rgba(252,129,129,.1);border:1px solid rgba(252,129,129,.3);border-radius:8px;padding:12px 16px;font-size:.82rem;color:var(--red);margin-bottom:14px}
.tc{text-align:center}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.flex{display:flex}.aic{align-items:center}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.wfull{width:100%}.jcc{justify-content:center}

@media(max-width:900px){
  .nav{padding:0 22px}.nav-links{display:none}.hamburger{display:flex}
  .hero{padding:120px 22px 80px}.sec{padding:68px 22px}.email-sec{padding:68px 22px}
  .g3,.g4{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
  .fg-grid{grid-template-columns:1fr 1fr;gap:28px}

function useToast(){
  const [toasts,setToasts]=useState([]);
  const add=useCallback((ico,title,msg)=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,ico,title,msg}]);
    setTimeout(()=>{setToasts(t=>t.map(x=>x.id===id?{...x,rm:true}:x));setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),350);},4200);
  },[]);
  const rm=useCallback(id=>{setToasts(t=>t.map(x=>x.id===id?{...x,rm:true}:x));setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),350);},[]);
  return{toasts,add,rm};
}
